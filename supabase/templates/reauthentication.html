<!doctype html>
<html lang="pt-BR">
  <body style="margin:0;padding:32px 16px;background:#f3f6f9;font-family:Arial,sans-serif;color:#10243a">
    <main style="max-width:560px;margin:0 auto;padding:28px;background:#fff;border-radius:14px">
      <h1 style="margin:0 0 20px;font-size:24px">Oficina Inteligente</h1>
      <h2 style="font-size:19px">Confirme sua identidade</h2>
      <p>Use este código para confirmar sua identidade:</p>
      <p style="padding:16px;background:#f3f6f9;border-radius:8px;font-size:28px;letter-spacing:5px;font-weight:bold">{{ .Token }}</p>
      <p style="color:#64758a;font-size:13px">Se você não iniciou esta solicitação, ignore esta mensagem.</p>
    </main>
  </body>
</html>
